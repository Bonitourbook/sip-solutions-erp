name: Build Android APK (MVC Complete)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JAVA_VERSION: "17"
      FLUTTER_VERSION: "3.19.5"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.5"
          channel: stable
          cache: true

      - name: Install Android SDK commandline tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            cd /tmp
            curl -fLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -qo cmdline-tools.zip
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Regenerar estructura nativa compatible
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.erpjuan --project-name erp_juan --overwrite
          sed -i 's/android:label="[^"]*"/android:label="SIP Solutions ERP"/g' android/app/src/main/AndroidManifest.xml

      - name: Implementar Estructura MVC y Módulos Completos
        run: |
          mkdir -p lib/models lib/controllers lib/views

          # 1. MODELO
          cat << 'EOF' > lib/models/transaction_model.dart
          class TransactionModel {
            final int? id;
            final String type;
            final String client;
            final String clientType;
            final double amount;
            final String status;
            final String date;

            TransactionModel({
              this.id,
              required this.type,
              required this.client,
              required this.clientType,
              required this.amount,
              required this.status,
              required this.date,
            });

            Map<String, dynamic> toMap() {
              return {
                'id': id,
                'type': type,
                'client': client,
                'client_type': clientType,
                'amount': amount,
                'status': status,
                'date': date,
              };
            }

            factory TransactionModel.fromMap(Map<String, dynamic> map) {
              return TransactionModel(
                id: map['id'],
                type: map['type'],
                client: map['client'],
                clientType: map['client_type'],
                amount: map['amount'],
                status: map['status'],
                date: map['date'],
              );
            }
          }
          EOF

          # 2. CONTROLADOR
          cat << 'EOF' > lib/controllers/erp_controller.dart
          import 'package:path/path.dart';
          import 'package:sqflite/sqflite.dart';
          import '../models/transaction_model.dart';

          class ErpController {
            static final ErpController instance = ErpController._init();
            static Database? _database;

            ErpController._init();

            Future<Database> get database async {
              if (_database != null) return _database!;
              _database = await _initDB('sip_solutions_erp.db');
              return _database!;
            }

            Future<Database> _initDB(String filePath) async {
              final dbPath = await getDatabasesPath();
              final path = join(dbPath, filePath);
              return await openDatabase(
                path,
                version: 1,
                onCreate: (db, version) async {
                  await db.execute('''
                    CREATE TABLE transactions (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      type TEXT,
                      client TEXT,
                      client_type TEXT,
                      amount REAL,
                      status TEXT,
                      date TEXT
                    )
                  ''');
                  await db.insert('transactions', {'type': 'VENTA', 'client': 'Olivia Chen (TechCorp)', 'client_type': 'Colaborador', 'amount': 3000.0, 'status': 'Vencida por 2 días', 'date': '2026-04-15'});
                  await db.insert('transactions', {'type': 'VENTA', 'client': 'Liam Brown (OmniSoft)', 'client_type': 'Cliente Final', 'amount': 3200.0, 'status': '¡Vence Hoy!', 'date': '2026-04-20'});
                },
              );
            }

            Future<List<TransactionModel>> getTransactions() async {
              final db = await instance.database;
              final result = await db.query('transactions', orderBy: 'id DESC');
              return result.map((json) => TransactionModel.fromMap(json)).toList();
            }

            Future<int> insertTransaction(TransactionModel transaction) async {
              final db = await instance.database;
              return await db.insert('transactions', transaction.toMap());
            }

            Future<double> getSum(String type) async {
              final db = await instance.database;
              final res = await db.rawQuery('SELECT SUM(amount) as total FROM transactions WHERE type = ?', [type]);
              if (res.isNotEmpty && res.first['total'] != null) {
                return (res.first['total'] as num).toDouble();
              }
              return 0.0;
            }
          }
          EOF

          # 3. VISTA: FORMULARIO
          cat << 'EOF' > lib/views/form_screen.dart
          import 'package:flutter/material.dart';
          import '../controllers/erp_controller.dart';
          import '../models/transaction_model.dart';

          class FormScreen extends StatefulWidget {
            final String title;
            final String type;
            const FormScreen({super.key, required this.title, required this.type});

            @override
            State<FormScreen> createState() => _FormScreenState();
          }

          class _FormScreenState extends State<FormScreen> {
            final clientC = TextEditingController();
            final amountC = TextEditingController();
            String clientType = 'Cliente Final';

            void save() async {
              final client = clientC.text.trim();
              final amount = double.tryParse(amountC.text) ?? 0.0;
              if (client.isEmpty || amount <= 0) return;

              final newTx = TransactionModel(
                type: widget.type,
                client: client,
                clientType: widget.type == 'VENTA' ? clientType : 'Proveedor',
                amount: amount,
                status: 'Activa',
                date: DateTime.now().toString().substring(0, 10),
              );

              await ErpController.instance.insertTransaction(newTx);
              if (mounted) Navigator.pop(context);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(widget.title), backgroundColor: const Color(0xFF111827)),
                body: Padding(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      TextField(controller: clientC, decoration: const InputDecoration(labelText: 'Cliente / Razón Social', border: OutlineInputBorder())),
                      const SizedBox(height: 16),
                      if (widget.type == 'VENTA') ...[
                        DropdownButtonFormField<String>(
                          value: clientType,
                          decoration: const InputDecoration(labelText: 'Tipo de Comprador', border: OutlineInputBorder()),
                          items: const [
                            DropdownMenuItem(value: 'Cliente Final', child: Text('Cliente Final (Precio Normal)')),
                            DropdownMenuItem(value: 'Colaborador', child: Text('Colaborador (Precio Diferenciado)')),
                          ],
                          onChanged: (val) {
                            if (val != null) setState(() => clientType = val);
                          },
                        ),
                        const SizedBox(height: 16),
                      ],
                      TextField(controller: amountC, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Monto Total (\$)', border: OutlineInputBorder())),
                      const SizedBox(height: 24),
                      ElevatedButton(
                        onPressed: save,
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF3b82f6), padding: const EdgeInsets.symmetric(vertical: 16)),
                        child: const Text('Guardar Registro', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 4. VISTA: DASHBOARD
          cat << 'EOF' > lib/views/dashboard_view.dart
          import 'package:flutter/material.dart';
          import '../controllers/erp_controller.dart';
          import '../models/transaction_model.dart';
          import 'form_screen.dart';

          class DashboardView extends StatefulWidget {
            const DashboardView({super.key});

            @override
            State<DashboardView> createState() => _DashboardViewState();
          }

          class _DashboardViewState extends State<DashboardView> {
            double totalIngresos = 245310.0;
            List<TransactionModel> items = [];

            @override
            void initState() {
              super.initState();
              loadData();
            }

            Future<void> loadData() async {
              final list = await ErpController.instance.getTransactions();
              setState(() {
                items = list;
              });
            }

            void _showAddOptions(BuildContext context) {
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF111827),
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (context) {
                  return Padding(
                    padding: const EdgeInsets.all(20),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const Text('Seleccionar Operación', style: TextStyle(color: Colors.white, fontSize: 16, fontWeight: FontWeight.bold)),
                        const SizedBox(height: 15),
                        ListTile(
                          leading: const Icon(Icons.point_of_sale, color: Colors.greenAccent),
                          title: const Text('Nueva Venta Contado / Factura', style: TextStyle(color: Colors.white)),
                          onTap: () {
                            Navigator.pop(context);
                            Navigator.push(context, MaterialPageRoute(builder: (_) => const FormScreen(title: 'Nueva Venta', type: 'VENTA'))).then((_) => loadData());
                          },
                        ),
                        ListTile(
                          leading: const Icon(Icons.request_quote, color: Colors.amberAccent),
                          title: const Text('Nueva Cta. Cobrar (Registrar crédito)', style: TextStyle(color: Colors.white)),
                          onTap: () {
                            Navigator.pop(context);
                            Navigator.push(context, MaterialPageRoute(builder: (_) => const FormScreen(title: 'Nueva Cta. Cobrar', type: 'VENTA'))).then((_) => loadData());
                          },
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF0b0f19),
                  elevation: 0,
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(8),
                        decoration: BoxDecoration(color: const Color(0xFF3b82f6), borderRadius: BorderRadius.circular(8)),
                        child: const Text('S', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: Colors.white)),
                      ),
                      const SizedBox(width: 12),
                      Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: const [
                          Text('SIP Solutions ERP', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.white)),
                          Text('• Cuentas & Alertas Activas', style: TextStyle(fontSize: 11, color: Colors.greenAccent)),
                        ],
                      ),
                    ],
                  ),
                  actions: [
                    Container(
                      margin: const EdgeInsets.symmetric(horizontal: 4),
                      padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                      decoration: BoxDecoration(color: Colors.white10, borderRadius: BorderRadius.circular(6)),
                      child: const Text('DARK UI', style: TextStyle(fontSize: 10, color: Colors.white70)),
                    ),
                    IconButton(icon: const Icon(Icons.refresh), onPressed: loadData),
                    IconButton(
                      icon: Container(
                        decoration: BoxDecoration(color: const Color(0xFF3b82f6), borderRadius: BorderRadius.circular(8)),
                        child: const Icon(Icons.add, color: Colors.white),
                      ),
                      onPressed: () => _showAddOptions(context),
                    ),
                  ],
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      Container(
                        padding: const EdgeInsets.all(12),
                        decoration: BoxDecoration(
                          color: const Color(0xFF1f161a),
                          border: Border.all(color: Colors.red.withOpacity(0.4)),
                          borderRadius: BorderRadius.circular(10),
                        ),
                        child: Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: const [
                            Row(
                              children: [
                                Icon(Icons.error_outline, color: Colors.red, size: 20),
                                SizedBox(width: 8),
                                Text('1 Deuda(s) Vencida(s) · Cobrar \$7,550', style: TextStyle(fontSize: 12, color: Colors.redAccent)),
                              ],
                            ),
                            Text('Exportar', style: TextStyle(color: Colors.blueAccent, fontWeight: FontWeight.bold, fontSize: 12)),
                          ],
                        ),
                      ),
                      const SizedBox(height: 16),
                      Row(
                        children: [
                          Expanded(child: MetricCard(title: 'Por Cobrar', val: '\$7,550.00', subtitle: '1 Vencidas (\$3000)', color: Colors.redAccent, icon: Icons.schedule)),
                          const SizedBox(width: 12),
                          Expanded(child: MetricCard(title: 'Ingresos', val: '\$${totalIngresos.toStringAsFixed(0)}', subtitle: '↗ +12.7% este mes', color: Colors.blueAccent, icon: Icons.attach_money)),
                        ],
                      ),
                      const SizedBox(height: 12),
                      Row(
                        children: [
                          const Expanded(child: MetricCard(title: 'Valor Stock', val: '\$54,450', subtitle: 'En inventario activo', color: Colors.blueGrey, icon: Icons.inventory_2)),
                          const SizedBox(width: 12),
                          const Expanded(child: MetricCard(title: 'Stock Bajo', val: '2 Prod.', subtitle: 'Requieren reposición', color: Colors.orangeAccent, icon: Icons.warning_amber)),
                        ],
                      ),
                      const SizedBox(height: 20),
                      Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(color: const Color(0xFF111827), borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.white10)),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              mainAxisAlignment: MainAxisAlignment.spaceBetween,
                              children: const [
                                Text('🔔 Próximos Vencimientos de Cobro', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.amber, fontSize: 13)),
                                Text('Ver Todo', style: TextStyle(color: Colors.blueAccent, fontSize: 12)),
                              ],
                            ),
                            const SizedBox(height: 12),
                            const VencimientoItem(client: 'Olivia Chen (TechCorp)', badge: 'Vencida por 2 días', amount: '\$3000.00', isAlert: true),
                            const Divider(color: Colors.white10),
                            const VencimientoItem(client: 'Liam Brown (OmniSoft)', badge: '¡Vence Hoy!', amount: '\$3200.00', isAlert: false),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class MetricCard extends StatelessWidget {
            final String title;
            final String val;
            final String subtitle;
            final Color color;
            final IconData icon;

            const MetricCard({super.key, required this.title, required this.val, required this.subtitle, required this.color, required this.icon});

            @override
            Widget build(BuildContext context) {
              return Container(
                padding: const EdgeInsets.all(14),
                decoration: BoxDecoration(color: const Color(0xFF111827), borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.white10)),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Row(
                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                      children: [
                        Text(title, style: const TextStyle(color: Colors.grey, fontSize: 12)),
                        Icon(icon, color: color, size: 16),
                      ],
                    ),
                    const SizedBox(height: 6),
                    Text(val, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.white)),
                    const SizedBox(height: 4),
                    Text(subtitle, style: TextStyle(fontSize: 10, color: color)),
                  ],
                ),
              );
            }
          }

          class VencimientoItem extends StatelessWidget {
            final String client;
            final String badge;
            final String amount;
            final bool isAlert;

            const VencimientoItem({super.key, required this.client, required this.badge, required this.amount, required this.isAlert});

            @override
            Widget build(BuildContext context) {
              return Row(
                mainAxisAlignment: MainAxisAlignment.spaceBetween,
                children: [
                  Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(client, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13, color: Colors.white)),
                      const SizedBox(height: 4),
                      Container(
                        padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                        decoration: BoxDecoration(
                          color: isAlert ? Colors.red.withOpacity(0.3) : Colors.amber.withOpacity(0.3),
                          borderRadius: BorderRadius.circular(4),
                        ),
                        child: Text(badge, style: TextStyle(fontSize: 10, color: isAlert ? Colors.redAccent : Colors.amberAccent)),
                      ),
                    ],
                  ),
                  Text(amount, style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.amber, fontSize: 14)),
                ],
              );
            }
          }
          EOF

          # 5. VISTA: NAVEGACIÓN INFERIOR
          cat << 'EOF' > lib/views/main_navigation.dart
          import 'package:flutter/material.dart';
          import 'dashboard_view.dart';

          class MainNavigation extends StatefulWidget {
            const MainNavigation({super.key});

            @override
            State<MainNavigation> createState() => _MainNavigationState();
          }

          class _MainNavigationState extends State<MainNavigation> {
            int _currentIndex = 0;

            final List<Widget> _screens = [
              const DashboardView(),
              const PlaceholderModule(title: 'Módulo de Cobros'),
              const PlaceholderModule(title: 'Módulo de Stock'),
              const PlaceholderModule(title: 'Módulo de Kardex'),
              const PlaceholderModule(title: 'Módulo de Clientes'),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: _screens[_currentIndex],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  onTap: (index) => setState(() => _currentIndex = index),
                  backgroundColor: const Color(0xFF0b0f19),
                  selectedItemColor: Colors.blueAccent,
                  unselectedItemColor: Colors.grey,
                  type: BottomNavigationBarType.fixed,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.dashboard_outlined), label: 'Inicio'),
                    BottomNavigationBarItem(icon: Icon(Icons.schedule), label: 'Cobros'),
                    BottomNavigationBarItem(icon: Icon(Icons.inventory_2_outlined), label: 'Stock'),
                    BottomNavigationBarItem(icon: Icon(Icons.receipt_long), label: 'Kardex'),
                    BottomNavigationBarItem(icon: Icon(Icons.people_outline), label: 'Clientes'),
                  ],
                ),
              );
            }
          }

          class PlaceholderModule extends StatelessWidget {
            final String title;
            const PlaceholderModule({super.key, required this.title});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(title), backgroundColor: const Color(0xFF111827)),
                body: Center(
                  child: Text('$title en desarrollo', style: const TextStyle(color: Colors.white, fontSize: 16)),
                ),
              );
            }
          }
          EOF

          # 6. MAIN GLOBAL
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'views/main_navigation.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const SipSolutionsApp());
          }

          class SipSolutionsApp extends StatelessWidget {
            const SipSolutionsApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'SIP Solutions ERP',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF0b0f19),
                  primaryColor: const Color(0xFF3b82f6),
                  cardColor: const Color(0xFF111827),
                ),
                home: const MainNavigation(),
              );
            }
          }
          EOF

      - name: Escribir pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: erp_juan
          description: "SIP Solutions ERP - MVC Architecture"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.3.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.3.2
            path: ^1.9.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Instalar dependencias de Flutter
        run: flutter pub get

      - name: Compilar APK en modo Release
        run: flutter build apk --release

      - name: Renombrar APK resultante
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/SIP_Solutions_ERP.apk"

      - name: Subir Artifact del APK
        uses: actions/upload-artifact@v4
        with:
          name: SIP_Solutions_ERP
          path: build/app/outputs/flutter-apk/SIP_Solutions_ERP.apk
