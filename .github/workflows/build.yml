                      ),
                      const SizedBox(height: 20),
                      Row(
                        children: [
                          Expanded(child: MetricCard(title: 'Por Cobrar', val: '\$7,550.00', subtitle: '1 Vencidas (\$3000)', color: Colors.redAccent, icon: Icons.schedule)),
                          const SizedBox(width: 12),
