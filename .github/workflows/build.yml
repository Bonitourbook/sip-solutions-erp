name: Build and Sync ERP Juan v1.0

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JAVA_VERSION: "17"
      FLUTTER_VERSION: "3.19.5"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.5"
          channel: stable
          cache: true

      - name: Install Android SDK commandline tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            cd /tmp
            curl -fLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -qo cmdline-tools.zip
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Regenerar estructura nativa compatible
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.erpjuan --project-name erp_juan --overwrite
          sed -i 's/android:label="[^"]*"/android:label="ERP Juan v1.0"/g' android/app/src/main/AndroidManifest.xml

      - name: Implementar Estructura MVC Completa de ERP Juan
        run: |
          mkdir -p lib/models lib/controllers lib/views

          # 1. MODELO
          cat << 'EOF' > lib/models/transaction_model.dart
          class TransactionModel {
            final int? id;
            final String type;
            final String client;
            final String clientType;
            final double amount;
            final double paidAmount;
            final String paymentMode;
            final bool hasDelivery;
            final String status;
            final String date;

            TransactionModel({
              this.id,
              required this.type,
              required this.client,
              required this.clientType,
              required this.amount,
              required this.paidAmount,
              required this.paymentMode,
              required this.hasDelivery,
              required this.status,
              required this.date,
            });

            Map<String, dynamic> toMap() {
              return {
                'id': id,
                'type': type,
                'client': client,
                'client_type': clientType,
                'amount': amount,
                'paid_amount': paidAmount,
                'payment_mode': paymentMode,
                'has_delivery': hasDelivery ? 1 : 0,
                'status': status,
                'date': date,
              };
            }

            factory TransactionModel.fromMap(Map<String, dynamic> map) {
              return TransactionModel(
                id: map['id'],
                type: map['type'],
                client: map['client'],
                clientType: map['client_type'],
                amount: map['amount'] ?? 0.0,
                paidAmount: map['paid_amount'] ?? 0.0,
                paymentMode: map['payment_mode'] ?? 'Contado',
                hasDelivery: map['has_delivery'] == 1,
                status: map['status'] ?? 'Activa',
                date: map['date'] ?? '',
              );
            }
          }
          EOF

          # 2. CONTROLADOR
          cat << 'EOF' > lib/controllers/erp_controller.dart
          import 'package:path/path.dart';
          import 'package:sqflite/sqflite.dart';
          import '../models/transaction_model.dart';

          class ErpController {
            static final ErpController instance = ErpController._init();
            static Database? _database;

            ErpController._init();

            Future<Database> get database async {
              if (_database != null) return _database!;
              _database = await _initDB('erp_juan_v1.db');
              return _database!;
            }

            Future<Database> _initDB(String filePath) async {
              final dbPath = await getDatabasesPath();
              final path = join(dbPath, filePath);
              return await openDatabase(
                path,
                version: 1,
                onCreate: (db, version) async {
                  await db.execute('''
                    CREATE TABLE transactions (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      type TEXT,
                      client TEXT,
                      client_type TEXT,
                      amount REAL,
                      paid_amount REAL,
                      payment_mode TEXT,
                      has_delivery INTEGER,
                      status TEXT,
                      date TEXT
                    )
                  ''');
                },
              );
            }

            Future<List<TransactionModel>> getTransactions() async {
              final db = await instance.database;
              final result = await db.query('transactions', orderBy: 'id DESC');
              return result.map((json) => TransactionModel.fromMap(json)).toList();
            }

            Future<int> insertTransaction(TransactionModel transaction) async {
              final db = await instance.database;
              return await db.insert('transactions', transaction.toMap());
            }

            Future<double> getSum(String type) async {
              final db = await instance.database;
              final res = await db.rawQuery('SELECT SUM(amount) as total FROM transactions WHERE type = ?', [type]);
              if (res.isNotEmpty && res.first['total'] != null) {
                return (res.first['total'] as num).toDouble();
              }
              return 0.0;
            }
          }
          EOF

          # 3. VISTA: FORMULARIO
          cat << 'EOF' > lib/views/form_screen.dart
          import 'package:flutter/material.dart';
          import '../controllers/erp_controller.dart';
          import '../models/transaction_model.dart';

          class FormScreen extends StatefulWidget {
            final String title;
            final String type;
            const FormScreen({super.key, required this.title, required this.type});

            @override
            State<FormScreen> createState() => _FormScreenState();
          }

          class _FormScreenState extends State<FormScreen> {
            final clientC = TextEditingController();
            final amountC = TextEditingController();
            final paidC = TextEditingController();
            
            String clientType = 'Cliente Final';
            String paymentMode = 'Contado';
            bool hasDelivery = false;

            final List<double> presetAmounts = [50.0, 100.0, 500.0, 1000.0];

            void save() async {
              final client = clientC.text.trim();
              final amount = double.tryParse(amountC.text) ?? 0.0;
              final paidAmount = paymentMode == 'Contado' 
                  ? amount 
                  : (paymentMode == 'Crédito' ? 0.0 : (double.tryParse(paidC.text) ?? 0.0));

              if (client.isEmpty || amount <= 0) return;

              final newTx = TransactionModel(
                type: widget.type,
                client: client,
                clientType: widget.type == 'VENTA' ? clientType : 'Proveedor',
                amount: amount,
                paidAmount: paidAmount,
                paymentMode: paymentMode,
                hasDelivery: hasDelivery,
                status: paidAmount < amount ? 'Pendiente / Crédito' : 'Completada',
                date: DateTime.now().toString().substring(0, 10),
              );

              await ErpController.instance.insertTransaction(newTx);
              if (mounted) Navigator.pop(context);
            }

            @override
            Widget build(BuildContext context) {
              final isVenta = widget.type == 'VENTA';
              return Scaffold(
                appBar: AppBar(title: Text(widget.title), backgroundColor: const Color(0xFF111827)),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      TextField(controller: clientC, decoration: const InputDecoration(labelText: 'Cliente / Proveedor / Razón Social', border: OutlineInputBorder())),
                      const SizedBox(height: 16),
                      if (isVenta) ...[
                        DropdownButtonFormField<String>(
                          value: clientType,
                          decoration: const InputDecoration(labelText: 'Tipo de Comprador', border: OutlineInputBorder()),
                          items: const [
                            DropdownMenuItem(value: 'Cliente Final', child: Text('Cliente Final (Precio Normal)')),
                            DropdownMenuItem(value: 'Colaborador', child: Text('Colaborador (Precio Diferenciado)')),
                          ],
                          onChanged: (val) => setState(() => clientType = val ?? 'Cliente Final'),
                        ),
                        const SizedBox(height: 16),
                      ],
                      TextField(controller: amountC, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Monto Total (\$)', border: OutlineInputBorder())),
                      const SizedBox(height: 10),
                      const Text('Montos preestablecidos:', style: TextStyle(color: Colors.grey, fontSize: 12)),
                      const SizedBox(height: 6),
                      Wrap(
                        spacing: 8,
                        children: presetAmounts.map((val) => ActionChip(
                          label: Text('\$$val'),
                          backgroundColor: const Color(0xFF111827),
                          labelStyle: const TextStyle(color: Colors.white),
                          onPressed: () => setState(() => amountC.text = val.toString()),
                        )).toList(),
                      ),
                      const SizedBox(height: 16),
                      if (isVenta) ...[
                        DropdownButtonFormField<String>(
                          value: paymentMode,
                          decoration: const InputDecoration(labelText: 'Modalidad de Pago', border: OutlineInputBorder()),
                          items: const [
                            DropdownMenuItem(value: 'Contado', child: Text('Contado (Pago Total)')),
                            DropdownMenuItem(value: 'Crédito', child: Text('Crédito (Cuenta por Cobrar)')),
                            DropdownMenuItem(value: 'Mixto', child: Text('Mixto (Parte contado, parte crédito)')),
                          ],
                          onChanged: (val) => setState(() => paymentMode = val ?? 'Contado'),
                        ),
                        if (paymentMode == 'Mixto') ...[
                          const SizedBox(height: 16),
                          TextField(controller: paidC, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Monto Pagado de Contado (\$)', border: OutlineInputBorder())),
                        ],
                        const SizedBox(height: 10),
                        SwitchListTile(
                          title: const Text('¿Incluye Delivery?', style: TextStyle(color: Colors.white, fontSize: 14)),
                          value: hasDelivery,
                          activeColor: Colors.blueAccent,
                          onChanged: (val) => setState(() => hasDelivery = val),
                        ),
                      ],
                      const SizedBox(height: 24),
                      ElevatedButton(
                        onPressed: save,
                        style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF3b82f6), padding: const EdgeInsets.symmetric(vertical: 16)),
                        child: Text('Guardar ${widget.title}', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 4. VISTA: DASHBOARD
          cat << 'EOF' > lib/views/dashboard_view.dart
          import 'package:flutter/material.dart';
          import '../controllers/erp_controller.dart';
          import '../models/transaction_model.dart';
          import 'form_screen.dart';

          class DashboardView extends StatefulWidget {
            const DashboardView({super.key});

            @override
            State<DashboardView> createState() => _DashboardViewState();
          }

          class _DashboardViewState extends State<DashboardView> {
            double totalVentas = 0.0;
            double totalCompras = 0.0;
            List<TransactionModel> items = [];

            @override
            void initState() {
              super.initState();
              loadData();
            }

            Future<void> loadData() async {
              final v = await ErpController.instance.getSum('VENTA');
              final c = await ErpController.instance.getSum('COMPRA');
              final list = await ErpController.instance.getTransactions();
              setState(() {
                totalVentas = v;
                totalCompras = c;
                items = list;
              });
            }

            void _showAddOptions(BuildContext context) {
              showDialog(
                context: context,
                builder: (context) {
                  return AlertDialog(
                    backgroundColor: const Color(0xFF111827),
                    shape: RoundedRectangleBorder(
                      borderRadius: BorderRadius.circular(16),
                      side: const BorderSide(color: Colors.white10),
                    ),
                    title: const Text(
                      'MENÚ RÁPIDO ERP',
                      style: TextStyle(color: Colors.white, fontSize: 15, fontWeight: FontWeight.bold, letterSpacing: 1.2),
                      textAlign: TextAlign.center,
                    ),
                    content: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        ListTile(
                          leading: const Icon(Icons.request_quote, color: Colors.redAccent),
                          title: const Text('Nueva Cuenta por Cobrar', style: TextStyle(color: Colors.white, fontSize: 13)),
                          onTap: () {
                            Navigator.pop(context);
                            Navigator.push(context, MaterialPageRoute(builder: (_) => const FormScreen(title: 'Nueva Cuenta por Cobrar', type: 'VENTA'))).then((_) => loadData());
                          },
                        ),
                        const Divider(color: Colors.white10),
                        ListTile(
                          leading: const Icon(Icons.shopping_cart_outlined, color: Colors.greenAccent),
                          title: const Text('Registrar Venta', style: TextStyle(color: Colors.white, fontSize: 13)),
                          onTap: () {
                            Navigator.pop(context);
                            Navigator.push(context, MaterialPageRoute(builder: (_) => const FormScreen(title: 'Registrar Venta', type: 'VENTA'))).then((_) => loadData());
                          },
                        ),
                        const Divider(color: Colors.white10),
                        ListTile(
                          leading: const Icon(Icons.inventory_2_outlined, color: Colors.blueAccent),
                          title: const Text('Nuevo Producto', style: TextStyle(color: Colors.white, fontSize: 13)),
                          onTap: () {
                            Navigator.pop(context);
                            Navigator.push(context, MaterialPageRoute(builder: (_) => const FormScreen(title: 'Nuevo Producto', type: 'COMPRA'))).then((_) => loadData());
                          },
                        ),
                        const SizedBox(height: 10),
                        TextButton(
                          onPressed: () => Navigator.pop(context),
                          child: const Text('Cerrar', style: TextStyle(color: Colors.grey, fontWeight: FontWeight.bold)),
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              double rentabilidad = totalVentas - totalCompras;

              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF0b0f19),
                  elevation: 0,
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(8),
                        decoration: BoxDecoration(color: const Color(0xFF3b82f6), borderRadius: BorderRadius.circular(8)),
                        child: const Text('S', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: Colors.white)),
                      ),
                      const SizedBox(width: 12),
                      Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: const [
                          Text('ERP Juan v1.0', style: TextStyle(fontSize: 15, fontWeight: FontWeight.bold, color: Colors.white)),
                          Text('• Cuentas & Alertas Activas', style: TextStyle(fontSize: 10, color: Colors.greenAccent)),
                        ],
                      ),
                    ],
                  ),
                  actions: [
                    Container(
                      margin: const EdgeInsets.symmetric(horizontal: 4, vertical: 8),
                      padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                      decoration: BoxDecoration(color: const Color(0xFF1e293b), borderRadius: BorderRadius.circular(6)),
                      child: const Text('Por Juan', style: TextStyle(fontSize: 10, color: Colors.white70, fontWeight: FontWeight.bold)),
                    ),
                    IconButton(icon: const Icon(Icons.refresh, size: 20), onPressed: loadData),
                    IconButton(
                      icon: Container(
                        padding: const EdgeInsets.all(4),
                        decoration: BoxDecoration(color: const Color(0xFF3b82f6), borderRadius: BorderRadius.circular(8)),
                        child: const Icon(Icons.add, color: Colors.white, size: 20),
                      ),
                      onPressed: () => _showAddOptions(context),
                    ),
                  ],
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(
                          color: const Color(0xFF111827),
                          borderRadius: BorderRadius.circular(12),
                          border: Border.all(color: Colors.white10),
                        ),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text('Rentabilidad', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.white)),
                            const SizedBox(height: 2),
                            const Text('Total ventas vs Total compras', style: TextStyle(fontSize: 11, color: Colors.grey)),
                            const SizedBox(height: 10),
                            Text('\$${rentabilidad.toStringAsFixed(2)}', style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold, color: rentabilidad >= 0 ? Colors.greenAccent : Colors.redAccent)),
                          ],
                        ),
                      ),
                      const SizedBox(height: 16),
                      Row(
                        children: [
                          Expanded(child: MetricCard(title: 'Ingresos Ventas', val: '\$${totalVentas.toStringAsFixed(2)}', subtitle: 'Registradas en sistema', color: Colors.blueAccent, icon: Icons.attach_money)),
                          const SizedBox(width: 12),
                          Expanded(child: MetricCard(title: 'Total Compras', val: '\$${totalCompras.toStringAsFixed(2)}', subtitle: 'Gastos de inventario', color: Colors.orangeAccent, icon: Icons.shopping_cart)),
                        ],
                      ),
                      const SizedBox(height: 20),
                      Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(color: const Color(0xFF111827), borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.white10)),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text('Historial Operativo', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.white, fontSize: 15)),
                            const SizedBox(height: 12),
                            if (items.isEmpty)
                              const Text('No hay registros todavía. Usa el botón "+" para agregar.', style: TextStyle(color: Colors.grey, fontSize: 12))
                            else
                              ...items.map((tx) => Padding(
                                padding: const EdgeInsets.symmetric(vertical: 6),
                                child: Row(
                                  mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                  children: [
                                    Column(
                                      crossAxisAlignment: CrossAxisAlignment.start,
                                      children: [
                                        Text(tx.client, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13, color: Colors.white)),
                                        Text('${tx.type} · ${tx.clientType} ${tx.hasDelivery ? "(Con Delivery)" : ""}', style: const TextStyle(fontSize: 10, color: Colors.grey)),
                                      ],
                                    ),
                                    Text('\$${tx.amount.toStringAsFixed(2)}', style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.amber, fontSize: 14)),
                                  ],
                                ),
                              )),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class MetricCard extends StatelessWidget {
            final String title;
            final String val;
            final String subtitle;
            final Color color;
            final IconData icon;

            const MetricCard({super.key, required this.title, required this.val, required this.subtitle, required this.color, required this.icon});

            @override
            Widget build(BuildContext context) {
              return Container(
                padding: const EdgeInsets.all(14),
                decoration: BoxDecoration(color: const Color(0xFF111827), borderRadius: BorderRadius.circular(12), border: Border.all(color: Colors.white10)),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Row(
                      mainAxisAlignment: MainAxisAlignment.spaceBetween,
                      children: [
                        Text(title, style: const TextStyle(color: Colors.grey, fontSize: 12)),
                        Icon(icon, color: color, size: 16),
                      ],
                    ),
                    const SizedBox(height: 6),
                    Text(val, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.white)),
                    const SizedBox(height: 4),
                    Text(subtitle, style: TextStyle(fontSize: 9, color: color)),
                  ],
                ),
              );
            }
          }
          EOF

          # 5. VISTA: NAVEGACIÓN INFERIOR
          cat << 'EOF' > lib/views/main_navigation.dart
          import 'package:flutter/material.dart';
          import 'dashboard_view.dart';

          class MainNavigation extends StatefulWidget {
            const MainNavigation({super.key});

            @override
            State<MainNavigation> createState() => _MainNavigationState();
          }

          class _MainNavigationState extends State<MainNavigation> {
            int _currentIndex = 0;

            final List<Widget> _screens = [
              const DashboardView(),
              const PlaceholderModule(title: 'Módulo de Cobros'),
              const PlaceholderModule(title: 'Módulo de Stock'),
              const PlaceholderModule(title: 'Módulo de Kardex'),
              const PlaceholderModule(title: 'Módulo de Clientes'),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: _screens[_currentIndex],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentIndex,
                  onTap: (index) => setState(() => _currentIndex = index),
                  backgroundColor: const Color(0xFF0b0f19),
                  selectedItemColor: Colors.blueAccent,
                  unselectedItemColor: Colors.grey,
                  type: BottomNavigationBarType.fixed,
                  items: const [
                    BottomNavigationBarItem(icon: Icon(Icons.dashboard_outlined), label: 'Inicio'),
                    BottomNavigationBarItem(icon: Icon(Icons.schedule), label: 'Cobros'),
                    BottomNavigationBarItem(icon: Icon(Icons.inventory_2_outlined), label: 'Stock'),
                    BottomNavigationBarItem(icon: Icon(Icons.receipt_long), label: 'Kardex'),
                    BottomNavigationBarItem(icon: Icon(Icons.people_outline), label: 'Clientes'),
                  ],
                ),
              );
            }
          }

          class PlaceholderModule extends StatelessWidget {
            final String title;
            const PlaceholderModule({super.key, required this.title});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(title), backgroundColor: const Color(0xFF111827)),
                body: Center(
                  child: Text('$title en desarrollo', style: const TextStyle(color: Colors.white, fontSize: 16)),
                ),
              );
            }
          }
          EOF

          # 6. MAIN GLOBAL
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'views/main_navigation.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const ErpJuanApp());
          }

          class ErpJuanApp extends StatelessWidget {
            const ErpJuanApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'ERP Juan v1.0',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF0b0f19),
                  primaryColor: const Color(0xFF3b82f6),
                  cardColor: const Color(0xFF111827),
                ),
                home: const MainNavigation(),
              );
            }
          }
          EOF

          # 7. PUBSPEC.YAML
          cat << 'EOF' > pubspec.yaml
          name: erp_juan
          description: "ERP Juan v1.0 - MVC Architecture"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.3.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.3.2
            path: ^1.9.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Sincronizar y guardar archivos en el repositorio (Git Commit)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add lib/ pubspec.yaml
          git commit -m "chore: actualizar diseño, etiqueta Por Juan y menú rápido en ERP Juan v1.0" || echo "No hay cambios que comprometer"
          git push || echo "Push omitido o sin cambios pendientes"

      - name: Instalar dependencias de Flutter
        run: flutter pub get

      - name: Compilar APK en modo Release
        run: flutter build apk --release

      - name: Renombrar APK resultante
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/ERP_Juan_v1.0.apk"

      - name: Subir Artifact del APK
        uses: actions/upload-artifact@v4
        with:
          name: ERP_Juan_v1.0
          path: build/app/outputs/flutter-apk/ERP_Juan_v1.0.apk
