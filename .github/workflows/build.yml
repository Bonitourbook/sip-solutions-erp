name: Build Android APK (MVC Architecture)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JAVA_VERSION: "17"
      FLUTTER_VERSION: "3.19.5"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.5"
          channel: stable
          cache: true

      - name: Install Android SDK commandline tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            cd /tmp
            curl -fLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -qo cmdline-tools.zip
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Regenerar estructura nativa compatible
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.erpjuan --project-name erp_juan --overwrite
          sed -i 's/android:label="[^"]*"/android:label="ERP Juan"/g' android/app/src/main/AndroidManifest.xml

      - name: Implementar Arquitectura MVC en el Proyecto
        run: |
          mkdir -p lib/models lib/controllers lib/views

          # 1. MODELO: TransactionModel
          cat << 'EOF' > lib/models/transaction_model.dart
          class TransactionModel {
            final int? id;
            final String type;
            final String client;
            final String clientType;
            final double amount;
            final String status;
            final String date;

            TransactionModel({
              this.id,
              required this.type,
              required this.client,
              required this.clientType,
              required this.amount,
              required this.status,
              required this.date,
            });

            Map<String, dynamic> toMap() {
              return {
                'id': id,
                'type': type,
                'client': client,
                'client_type': clientType,
                'amount': amount,
                'status': status,
                'date': date,
              };
            }

            factory TransactionModel.fromMap(Map<String, dynamic> map) {
              return TransactionModel(
                id: map['id'],
                type: map['type'],
                client: map['client'],
                clientType: map['client_type'],
                amount: map['amount'],
                status: map['status'],
                date: map['date'],
              );
            }
          }
          EOF

          # 2. CONTROLADOR: ErpController (SQLite y Lógica de Negocio)
          cat << 'EOF' > lib/controllers/erp_controller.dart
          import 'package:path/path.dart';
          import 'package:sqflite/sqflite.dart';
          import '../models/transaction_model.dart';

          class ErpController {
            static final ErpController instance = ErpController._init();
            static Database? _database;

            ErpController._init();

            Future<Database> get database async {
              if (_database != null) return _database!;
              _database = await _initDB('erp_juan_mvc.db');
              return _database!;
            }

            Future<Database> _initDB(String filePath) async {
              final dbPath = await getDatabasesPath();
              final path = join(dbPath, filePath);
              return await openDatabase(
                path,
                version: 1,
                onCreate: (db, version) async {
                  await db.execute('''
                    CREATE TABLE transactions (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      type TEXT,
                      client TEXT,
                      client_type TEXT,
                      amount REAL,
                      status TEXT,
                      date TEXT
                    )
                  ''');
                  await db.insert('transactions', {'type': 'VENTA', 'client': 'Olivia Chen (TechCorp)', 'client_type': 'Colaborador', 'amount': 3000.0, 'status': 'Vencida por 2 días', 'date': '2026-04-15'});
                  await db.insert('transactions', {'type': 'VENTA', 'client': 'Liam Brown (OmniSoft)', 'client_type': 'Cliente Final', 'amount': 3200.0, 'status': '¡Vence Hoy!', 'date': '2026-04-20'});
                  await db.insert('transactions', {'type': 'COMPRA', 'client': 'Proveedor Central', 'client_type': 'Proveedor', 'amount': 15000.0, 'status': 'Completada', 'date': '2026-04-10'});
                },
              );
            }

            Future<List<TransactionModel>> getTransactions() async {
              final db = await instance.database;
              final result = await db.query('transactions', orderBy: 'id DESC');
              return result.map((json) => TransactionModel.fromMap(json)).toList();
            }

            Future<int> insertTransaction(TransactionModel transaction) async {
              final db = await instance.database;
              return await db.insert('transactions', transaction.toMap());
            }

            Future<double> getSum(String type) async {
              final db = await instance.database;
              final res = await db.rawQuery('SELECT SUM(amount) as total FROM transactions WHERE type = ?', [type]);
              if (res.isNotEmpty && res.first['total'] != null) {
                return (res.first['total'] as num).toDouble();
              }
              return 0.0;
            }
          }
          EOF

          # 3. VISTA: FormScreen (Formulario de Transacciones)
          cat << 'EOF' > lib/views/form_screen.dart
          import 'package:flutter/material.dart';
          import '../controllers/erp_controller.dart';
          import '../models/transaction_model.dart';

          class FormScreen extends StatefulWidget {
            final String type;
            const FormScreen({super.key, required this.type});

            @override
            State<FormScreen> createState() => _FormScreenState();
          }

          class _FormScreenState extends State<FormScreen> {
            final clientC = TextEditingController();
            final amountC = TextEditingController();
            String clientType = 'Cliente Final';

            void save() async {
              final client = clientC.text.trim();
              final amount = double.tryParse(amountC.text) ?? 0.0;
              if (client.isEmpty || amount <= 0) return;

              final newTx = TransactionModel(
                type: widget.type,
                client: client,
                clientType: widget.type == 'VENTA' ? clientType : 'Proveedor',
                amount: amount,
                status: 'Activa',
                date: DateTime.now().toString().substring(0, 10),
              );

              await ErpController.instance.insertTransaction(newTx);
              if (mounted) Navigator.pop(context);
            }

            @override
            Widget build(BuildContext context) {
              final isV = widget.type == 'VENTA';
              return Scaffold(
                appBar: AppBar(title: Text(isV ? 'Registrar Nueva Venta' : 'Registrar Nueva Compra'), backgroundColor: const Color(0xFF111827)),
                body: Padding(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      TextField(controller: clientC, decoration: const InputDecoration(labelText: 'Nombre / Razón Social', border: OutlineInputBorder())),
                      const SizedBox(height: 16),
                      if (isV) ...[
                        DropdownButtonFormField<String>(
                          value: clientType,
                          decoration: const InputDecoration(labelText: 'Tipo de Comprador', border: OutlineInputBorder()),
                          items: const [
                            DropdownMenuItem(value: 'Cliente Final', child: Text('Cliente Final (Precio Normal)')),
                            DropdownMenuItem(value: 'Colaborador', child: Text('Colaborador (Precio Diferenciado)')),
                          ],
                          onChanged: (val) {
                            if (val != null) setState(() => clientType = val);
                          },
                        ),
                        const SizedBox(height: 16),
                      ],
                      TextField(controller: amountC, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Monto Total (\$)', border: OutlineInputBorder())),
                      const SizedBox(height: 24),
                      ElevatedButton(
                        onPressed: save,
                        style: ElevatedButton.styleFrom(
                          backgroundColor: isV ? const Color(0xFF10b981) : const Color(0xFF3b82f6),
                          padding: const EdgeInsets.symmetric(vertical: 16),
                        ),
                        child: Text('Guardar ' + widget.type, style: const TextStyle(fontWeight: FontWeight.bold)),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 4. VISTA: DashboardScreen (Panel de Control Principal)
          cat << 'EOF' > lib/views/dashboard_screen.dart
          import 'package:flutter/material.dart';
          import '../controllers/erp_controller.dart';
          import '../models/transaction_model.dart';
          import 'form_screen.dart';

          class DashboardScreen extends StatefulWidget {
            const DashboardScreen({super.key});

            @override
            State<DashboardScreen> createState() => _DashboardScreenState();
          }

          class _DashboardScreenState extends State<DashboardScreen> {
            double totalVentas = 0.0;
            List<TransactionModel> items = [];

            @override
            void initState() {
              super.initState();
              refreshData();
            }

            Future<void> refreshData() async {
              final v = await ErpController.instance.getSum('VENTA');
              final list = await ErpController.instance.getTransactions();
              setState(() {
                totalVentas = v;
                items = list;
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF0b0f19),
                  elevation: 0,
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(8),
                        decoration: BoxDecoration(color: const Color(0xFF3b82f6), borderRadius: BorderRadius.circular(8)),
                        child: const Text('S', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                      ),
                      const SizedBox(width: 12),
                      Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: const [
                          Text('ERP Juan (MVC)', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                          Text('• Cuentas & Alertas Activas', style: TextStyle(fontSize: 11, color: Colors.green)),
                        ],
                      ),
                    ],
                  ),
                  actions: [
                    IconButton(icon: const Icon(Icons.refresh), onPressed: refreshData),
                  ],
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      Row(
                        children: [
                          Expanded(
                            child: ElevatedButton.icon(
                              onPressed: () async {
                                await Navigator.push(context, MaterialPageRoute(builder: (_) => const FormScreen(type: 'VENTA')));
                                refreshData();
                              },
                              icon: const Icon(Icons.point_of_sale, size: 22),
                              label: const Text('Nueva Venta', style: TextStyle(fontWeight: FontWeight.bold)),
                              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF10b981), padding: const EdgeInsets.symmetric(vertical: 16)),
                            ),
                          ),
                          const SizedBox(width: 12),
                          Expanded(
                            child: ElevatedButton.icon(
                              onPressed: () async {
                                await Navigator.push(context, MaterialPageRoute(builder: (_) => const FormScreen(type: 'COMPRA')));
                                refreshData();
                              },
                              icon: const Icon(Icons.shopping_cart_outlined, size: 22),
                              label: const Text('Nueva Compra', style: TextStyle(fontWeight: FontWeight.bold)),
                              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF3b82f6), padding: const EdgeInsets.symmetric(vertical: 16)),
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 20),
                      Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(color: const Color(0xFF111827), borderRadius: BorderRadius.circular(12)),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text('Registro Operativo', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                            const SizedBox(height: 12),
                            ...items.map((tx) => Padding(
                              padding: const EdgeInsets.symmetric(vertical: 6),
                              child: Row(
                                mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                children: [
                                  Row(
                                    children: [
                                      CircleAvatar(
                                        radius: 15,
                                        backgroundColor: tx.type == 'VENTA' ? Colors.green.withOpacity(0.2) : Colors.blue.withOpacity(0.2),
                                        child: Icon(tx.type == 'VENTA' ? Icons.arrow_downward : Icons.arrow_upward, color: tx.type == 'VENTA' ? Colors.greenAccent : Colors.blueAccent, size: 14),
                                      ),
                                      const SizedBox(width: 10),
                                      Column(
                                        crossAxisAlignment: CrossAxisAlignment.start,
                                        children: [
                                          Text(tx.client, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13)),
                                          Text(tx.type + ' · ' + tx.clientType, style: const TextStyle(fontSize: 10, color: Colors.grey)),
                                        ],
                                      ),
                                    ],
                                  ),
                                  Text('\$' + tx.amount.toString(), style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.amber, fontSize: 14)),
                                ],
                              ),
                            )),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 5. MAIN: Punto de entrada principal
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'views/dashboard_screen.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const ErpJuanApp());
          }

          class ErpJuanApp extends StatelessWidget {
            const ErpJuanApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'ERP Juan',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF0b0f19),
                  primaryColor: const Color(0xFF3b82f6),
                  cardColor: const Color(0xFF111827),
                ),
                home: const DashboardScreen(),
              );
            }
          }
          EOF

      - name: Escribir pubspec.yaml con sqflite y path
        run: |
          cat << 'EOF' > pubspec.yaml
          name: erp_juan
          description: "ERP Juan - Arquitectura MVC con SQLite"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.3.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            sqflite: ^2.3.2
            path: ^1.9.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Instalar dependencias de Flutter
        run: flutter pub get

      - name: Compilar APK en modo Release
        run: flutter build apk --release

      - name: Renombrar APK resultante
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/ERP_Juan.apk"

      - name: Subir Artifact del APK
        uses: actions/upload-artifact@v4
        with:
          name: ERP_Juan
          path: build/app/outputs/flutter-apk/ERP_Juan.apk
