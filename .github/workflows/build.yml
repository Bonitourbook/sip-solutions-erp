name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JAVA_VERSION: "17"
      FLUTTER_VERSION: "3.19.5"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.5"
          channel: stable
          cache: true

      - name: Install Android SDK commandline tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          if [ ! -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            cd /tmp
            curl -fLo cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -qo cmdline-tools.zip
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Regenerate Android native structure
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.erpjuan --project-name erp_juan --overwrite
          sed -i 's/android:label="[^"]*"/android:label="ERP Juan"/g' android/app/src/main/AndroidManifest.xml

      - name: Write pubspec.yaml
        run: |
          echo "name: erp_juan" > pubspec.yaml
          echo "description: 'ERP Juan - Sistema Comercial'" >> pubspec.yaml
          echo "publish_to: 'none'" >> pubspec.yaml
          echo "version: 1.0.0+1" >> pubspec.yaml
          echo "" >> pubspec.yaml
          echo "environment:" >> pubspec.yaml
          echo "  sdk: '>=3.3.0 <4.0.0'" >> pubspec.yaml
          echo "" >> pubspec.yaml
          echo "dependencies:" >> pubspec.yaml
          echo "  flutter:" >> pubspec.yaml
          echo "    sdk: flutter" >> pubspec.yaml
          echo "  sqflite: ^2.3.2" >> pubspec.yaml
          echo "  path: ^1.9.0" >> pubspec.yaml
          echo "" >> pubspec.yaml
          echo "dev_dependencies:" >> pubspec.yaml
          echo "  flutter_test:" >> pubspec.yaml
          echo "    sdk: flutter" >> pubspec.yaml
          echo "  flutter_lints: ^3.0.0" >> pubspec.yaml
          echo "" >> pubspec.yaml
          echo "flutter:" >> pubspec.yaml
          echo "  uses-material-design: true" >> pubspec.yaml

      - name: Write main.dart
        run: |
          mkdir -p lib
          cat << 'DART_CODE' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:path/path.dart';
          import 'package:sqflite/sqflite.dart';

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const ErpApp());
          }

          class DatabaseHelper {
            static final DatabaseHelper instance = DatabaseHelper._init();
            static Database? _database;

            DatabaseHelper._init();

            Future<Database> get database async {
              if (_database != null) return _database!;
              _database = await _initDB('erp_juan.db');
              return _database!;
            }

            Future<Database> _initDB(String filePath) async {
              final dbPath = await getDatabasesPath();
              final path = join(dbPath, filePath);
              return await openDatabase(
                path,
                version: 1,
                onCreate: (db, version) async {
                  await db.execute('''
                    CREATE TABLE tx (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      type TEXT,
                      client TEXT,
                      amount REAL,
                      date TEXT
                    )
                  ''');
                },
              );
            }

            Future<List>> getTransactions() async {
              final db = await instance.database;
              return await db.query('tx', orderBy: 'id DESC');
            }

            Future<int> insert(Map<String, dynamic> row) async {
              final db = await instance.database;
              return await db.insert('tx', row);
            }

            Future<double> getSum(String type) async {
              final db = await instance.database;
              final res = await db.rawQuery('SELECT SUM(amount) as total FROM tx WHERE type = ?', [type]);
              if (res.isNotEmpty && res.first['total'] != null) {
                return (res.first['total'] as num).toDouble();
              }
              return 0.0;
            }
          }

          class ErpApp extends StatelessWidget {
            const ErpApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'ERP Juan',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: const Color(0xFF0b0f19),
                  primaryColor: const Color(0xFF3b82f6),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            double ventas = 0.0;
            double compras = 0.0;
            List> items = [];

            @override
            void initState() {
              super.initState();
              refresh();
            }

            Future<void> refresh() async {
              final v = await DatabaseHelper.instance.getSum('VENTA');
              final c = await DatabaseHelper.instance.getSum('COMPRA');
              final list = await DatabaseHelper.instance.getTransactions();
              setState(() {
                ventas = v;
                compras = c;
                items = list;
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('ERP Juan'),
                  backgroundColor: const Color(0xFF111827),
                  actions: [
                    IconButton(icon: const Icon(Icons.refresh), onPressed: refresh),
                  ],
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Row(
                      children: [
                        Expanded(
                          child: ElevatedButton.icon(
                            onPressed: () async {
                              await Navigator.push(context, MaterialPageRoute(builder: (_) => const FormScreen(type: 'VENTA')));
                              refresh();
                            },
                            icon: const Icon(Icons.point_of_sale),
                            label: const Text('Nueva Venta'),
                            style: ElevatedButton.styleFrom(
                              backgroundColor: const Color(0xFF10b981),
                              foregroundColor: Colors.white,
                              padding: const EdgeInsets.symmetric(vertical: 16),
                            ),
                          ),
                        ),
                        const SizedBox(width: 12),
                        Expanded(
                          child: ElevatedButton.icon(
                            onPressed: () async {
                              await Navigator.push(context, MaterialPageRoute(builder: (_) => const FormScreen(type: 'COMPRA')));
                              refresh();
                            },
                            icon: const Icon(Icons.shopping_cart),
                            label: const Text('Nueva Compra'),
                            style: ElevatedButton.styleFrom(
                              backgroundColor: const Color(0xFF3b82f6),
                              foregroundColor: Colors.white,
                              padding: const EdgeInsets.symmetric(vertical: 16),
                            ),
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 20),
                    Row(
                      children: [
                        Expanded(child: MetricCard(title: 'Ventas Total', val: '\$${ventas.toStringAsFixed(2)}', color: Colors.greenAccent)),
                        const SizedBox(width: 12),
                        Expanded(child: MetricCard(title: 'Compras Total', val: '\$${compras.toStringAsFixed(2)}', color: Colors.blueAccent)),
                      ],
                    ),
                    const SizedBox(height: 20),
                    const Text('Operaciones', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 10),
                    ...items.map((tx) => Card(
                          color: const Color(0xFF111827),
                          child: ListTile(
                            title: Text(tx['client'].toString(), style: const TextStyle(fontWeight: FontWeight.bold)),
                            subtitle: Text('${tx['type']} - ${tx['date']}'),
                            trailing: Text('\$${tx['amount']}', style: const TextStyle(color: Colors.amber, fontWeight: FontWeight.bold)),
                          ),
                        )),
                  ],
                ),
              );
            }
          }

          class MetricCard extends StatelessWidget {
            final String title;
            final String val;
            final Color color;
            const MetricCard({super.key, required this.title, required this.val, required this.color});

            @override
            Widget build(BuildContext context) {
              return Container(
                padding: const EdgeInsets.all(16),
                decoration: BoxDecoration(
                  color: const Color(0xFF111827),
                  borderRadius: BorderRadius.circular(10),
                ),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Text(title, style: const TextStyle(color: Colors.grey, fontSize: 12)),
                    const SizedBox(height: 8),
                    Text(val, style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: color)),
                  ],
                ),
              );
            }
          }

          class FormScreen extends StatefulWidget {
            final String type;
            const FormScreen({super.key, required this.type});

            @override
            State<FormScreen> createState() => _FormScreenState();
          }

          class _FormScreenState extends State<FormScreen> {
            final clientC = TextEditingController();
            final amountC = TextEditingController();

            void save() async {
              final client = clientC.text.trim();
              final amount = double.tryParse(amountC.text) ?? 0.0;
              if (client.isEmpty || amount <= 0) return;

              await DatabaseHelper.instance.insert({
                'type': widget.type,
                'client': client,
                'amount': amount,
                'date': DateTime.now().toString().substring(0, 10),
              });
              if (mounted) Navigator.pop(context);
            }

            @override
            Widget build(BuildContext context) {
              final isV = widget.type == 'VENTA';
              return Scaffold(
                appBar: AppBar(title: Text(isV ? 'Nueva Venta' : 'Nueva Compra'), backgroundColor: const Color(0xFF111827)),
                body: Padding(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    children: [
                      TextField(controller: clientC, decoration: const InputDecoration(labelText: 'Cliente / Proveedor')),
                      const SizedBox(height: 16),
                      TextField(controller: amountC, keyboardType: TextInputType.number, decoration: const InputDecoration(labelText: 'Monto')),
                      const SizedBox(height: 24),
                      ElevatedButton(
                        onPressed: save,
                        style: ElevatedButton.styleFrom(backgroundColor: isV ? Colors.green : Colors.blue),
                        child: Text('Guardar ${widget.type}'),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DART_CODE

      - name: Check Flutter environment
        run: flutter doctor -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK file
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/ERP_Juan.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ERP_Juan
          path: build/app/outputs/flutter-apk/ERP_Juan.apk
